<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Paw Haven is a compassionate, modern pet adoption platform connecting adoptable dogs, cats, rabbits, and birds with loving forever families." />

    <meta property="og:title" content="Paw Haven — Helping Every Paw Find a Forever Home" />
    <meta property="og:description" content="Discover adoptable pets with verified health records, compassionate shelter care, and full adoption guidance. Find your new best friend today." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:secure_url" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Schema.org JSON-LD for Animal Shelter Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AnimalShelter",
      "name": "Paw Haven",
      "description": "Helping every paw find a forever home.",
      "url": "https://pawhaven.org",
      "telephone": "+1-800-555-PAWS",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "124 Haven Lane",
        "addressLocality": "Austin",
        "addressRegion": "TX",
        "postalCode": "78701",
        "addressCountry": "US"
      },
      "openingHours": "Mo-Sa 09:00-18:00",
      "sameAs": [
        "https://facebook.com/pawhaven",
        "https://instagram.com/pawhaven"
      ]
